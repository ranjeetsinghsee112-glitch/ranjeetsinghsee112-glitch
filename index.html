<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjeet Kumar Singh | Azure DevOps Engineer</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(15, 23, 42, 0.6);
            --glass: blur(20px) saturate(180%);
            --border: 1px solid rgba(148, 163, 184, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-blue: #0078d4;
            --accent-cyan: #06b6d4;
            --accent-purple: #a855f7;
            --glow-blue: 0 0 20px rgba(0, 120, 212, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Gradients */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(0, 120, 212, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
            animation: gradientShift 20s infinite alternate;
            z-index: -1;
        }

        @keyframes gradientShift {
            0% { transform: translate(-30%, -30%); }
            100% { transform: translate(-10%, -10%); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* --- Header --- */
        header {
            text-align: center;
            padding: 80px 20px;
            background: var(--card-bg);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border: var(--border);
            border-radius: 30px;
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(0, 120, 212, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, #60a5fa, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 5s linear infinite;
        }

        @keyframes textGlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .typewriter {
            font-family: 'Fira Code', monospace;
            font-size: 1.4rem;
            color: var(--accent-cyan);
            font-weight: 500;
            min-height: 1.6em;
        }

        /* Floating Badges Animation */
        .badges-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .badges-row img {
            height: 35px;
            animation: float 4s ease-in-out infinite;
        }

        .badges-row img:nth-child(2) { animation-delay: 0.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .tagline {
            font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto;
        }

        /* --- Section Styling --- */
        section {
            background: var(--card-bg);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border: var(--border);
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #fff;
            font-weight: 700;
        }

        h2 i { color: var(--accent-blue); }

        /* --- About Grid --- */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            list-style: none;
        }

        .about-grid li {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            font-size: 0.95rem;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.3s ease;
        }

        .about-grid li:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 120, 212, 0.2);
            color: var(--text-main);
            transform: scale(1.02);
        }

        .about-grid li i { margin-top: 4px; font-size: 1.1rem; }

        /* --- Skills Icons (Animated) --- */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }

        .skill-item {
            text-align: center;
            width: 90px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .skill-item img {
            width: 60px; height: 60px;
            margin-bottom: 10px;
            filter: grayscale(30%) brightness(90%);
            transition: all 0.3s ease;
            background: #fff; /* white bg for skillicons visibility */
            padding: 5px;
            border-radius: 50%;
        }

        .skill-item:hover {
            transform: scale(1.15) translateY(-10px);
        }

        .skill-item:hover img {
            filter: grayscale(0%) brightness(100%);
            box-shadow: var(--glow-blue);
        }

        .skill-item b {
            display: block; font-size: 0.8rem; color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .skill-item:hover b { color: var(--accent-cyan); }

        /* --- Cloud Platforms & Tags --- */
        .cloud-logos {
            display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap;
        }
        .cloud-logos img { height: 45px; transition: transform 0.3s ease; }
        .cloud-logos img:hover { transform: scale(1.05); }

        .tags-container {
            display: flex; flex-wrap: wrap; gap: 12px;
        }

        .tag {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
            border: 1px solid rgba(6, 182, 212, 0.2);
            transition: all 0.3s ease;
        }
        .tag:hover {
            background: var(--accent-cyan);
            color: #05070a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(6, 182, 212, 0.3);
        }

        /* --- Table --- */
        .styled-table {
            width: 100%; border-collapse: collapse;
            font-size: 0.9rem; margin-top: 15px;
        }
        .styled-table th, .styled-table td {
            text-align: left; padding: 15px 20px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }
        .styled-table th { color: var(--text-main); background: rgba(255,255,255,0.03); }
        .styled-table td { color: var(--text-muted); }
        .styled-table tr:last-child td { border-bottom: none; }
        .styled-table tr:hover td { background: rgba(255,255,255,0.02); color: var(--text-main); }

        /* --- Featured Project --- */
        .project-box {
            background: linear-gradient(145deg, rgba(168, 85, 247, 0.08), rgba(0, 120, 212, 0.08));
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        /* --- Currently Exploring --- */
        .terminal-window {
            background: #0a0c10;
            border-radius: 12px;
            padding: 25px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #4ade80; /* Green text */
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            white-space: pre-wrap;
        }

        /* --- GitHub Graph --- */
        .activity-box { text-align: center; }
        .activity-box img { max-width: 100%; border-radius: 15px; filter: invert(0.95) hue-rotate(180deg); }

        /* --- Connect Buttons --- */
        .connect-section { text-align: center; }
        .connect-buttons {
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px;
        }

        .btn {
            padding: 15px 30px; border-radius: 12px;
            text-decoration: none; font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex; align-items: center; gap: 10px;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }

        .btn-linkedin { background: #0a66c2; color: #fff; }
        .btn-gmail { background: #ea4335; color: #fff; }
        .btn-github { background: #171515; color: #fff; border: 1px solid #444; }

        .btn:hover {
            transform: translateY(-5px);
            filter: brightness(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* --- Footer --- */
        footer {
            text-align: center; padding: 50px 20px;
            color: var(--text-muted); font-size: 0.9rem;
            border-top: var(--border); margin-top: 50px;
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 768px) {
            header h1 { font-size: 2.5rem; }
            .typewriter { font-size: 1rem; }
            .container { padding: 30px 15px; }
            header { padding: 50px 20px; }
            .skill-item { width: 70px; }
            .skill-item img { width: 45px; height: 45px; }
        }
    </style>
</head>
